<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="robots" content="noindex, nofollow">

  <title>Owner Dashboard | Braids by Athalia</title>

  <link rel="stylesheet" href="/styles.css">

  <style>
    :root {
      --dashboard-navy: #061631;
      --dashboard-blue: #123b7a;
      --dashboard-bright-blue: #1e5eb5;
      --dashboard-gold: #d5a62e;
      --dashboard-light-gold: #f0cf71;
      --dashboard-cream: #fff9ec;
      --dashboard-white: #ffffff;
      --dashboard-dark: #081326;
      --dashboard-muted: #68738a;
      --dashboard-border: rgba(18, 59, 122, 0.14);
      --dashboard-shadow: 0 18px 45px rgba(4, 23, 60, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body.owner-page {
      min-height: 100vh;
      margin: 0;
      color: var(--dashboard-dark);
      background:
        radial-gradient(
          circle at top left,
          rgba(213, 166, 46, 0.16),
          transparent 28%
        ),
        linear-gradient(135deg, #fffdf7, #eef4ff);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .owner-header {
      position: sticky;
      z-index: 100;
      top: 0;
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 5%;
      color: var(--dashboard-white);
      background:
        linear-gradient(
          110deg,
          rgba(6, 22, 49, 0.98),
          rgba(18, 59, 122, 0.98)
        );
      border-bottom: 3px solid var(--dashboard-gold);
      box-shadow: 0 8px 30px rgba(4, 17, 44, 0.24);
    }

    .owner-header .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--dashboard-white);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
    }

    .owner-header .brand span {
      display: grid;
      width: 50px;
      height: 50px;
      place-items: center;
      flex-shrink: 0;
      color: var(--dashboard-navy);
      background:
        linear-gradient(
          145deg,
          var(--dashboard-light-gold),
          var(--dashboard-gold)
        );
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      font-weight: 900;
      box-shadow: 0 5px 20px rgba(213, 166, 46, 0.34);
    }

    .website-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 10px 17px;
      color: var(--dashboard-white);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-decoration: none;
      text-transform: uppercase;
      transition:
        color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .website-link:hover {
      color: var(--dashboard-navy);
      background: var(--dashboard-light-gold);
      border-color: var(--dashboard-light-gold);
      transform: translateY(-2px);
    }

    .dashboard {
      width: min(1250px, 92%);
      margin: 0 auto;
      padding: 65px 0 100px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--dashboard-gold);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .login-panel {
      width: min(560px, 100%);
      margin: 50px auto;
      padding: 48px;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.99),
          rgba(255, 249, 236, 0.98)
        );
      border: 1px solid var(--dashboard-border);
      border-top: 6px solid var(--dashboard-gold);
      border-radius: 8px;
      box-shadow: 0 30px 70px rgba(5, 25, 65, 0.16);
    }

    .login-icon {
      display: grid;
      width: 70px;
      height: 70px;
      place-items: center;
      margin-bottom: 28px;
      color: var(--dashboard-light-gold);
      background:
        linear-gradient(
          145deg,
          var(--dashboard-navy),
          var(--dashboard-bright-blue)
        );
      border-radius: 50%;
      font-size: 1.7rem;
      box-shadow: 0 14px 30px rgba(18, 59, 122, 0.25);
    }

    .login-panel h1,
    .dashboard-head h1 {
      margin: 0;
      color: var(--dashboard-navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.6rem, 7vw, 5rem);
      font-weight: 500;
      line-height: 0.98;
    }

    .login-description {
      margin: 22px 0 28px;
      color: var(--dashboard-muted);
      font-size: 1rem;
    }

    #login-form {
      display: grid;
      gap: 16px;
    }

    .pin-label {
      display: grid;
      gap: 9px;
      color: var(--dashboard-navy);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #login-form input {
      width: 100%;
      min-height: 60px;
      padding: 15px 17px;
      color: var(--dashboard-dark);
      background: var(--dashboard-white);
      border: 1px solid #bbc6d5;
      border-radius: 4px;
      outline: none;
      font-size: 1.2rem;
      letter-spacing: 0.15em;
    }

    #login-form input:focus {
      border-color: var(--dashboard-gold);
      box-shadow: 0 0 0 4px rgba(213, 166, 46, 0.16);
    }

    .button {
      display: inline-flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      padding: 15px 24px;
      color: var(--dashboard-navy);
      background:
        linear-gradient(
          135deg,
          var(--dashboard-light-gold),
          var(--dashboard-gold)
        );
      border: 0;
      border-radius: 4px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 14px 30px rgba(213, 166, 46, 0.25);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(213, 166, 46, 0.34);
    }

    .message {
      min-height: 24px;
      margin: 0;
      color: #9c2d2d;
      font-weight: 700;
    }

    #booking-panel[hidden],
    #login-panel[hidden] {
      display: none !important;
    }

    .dashboard-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 35px;
    }

    .dashboard-head h1 {
      font-size: clamp(3rem, 7vw, 5.7rem);
    }

    .outline {
      min-height: 48px;
      padding: 11px 20px;
      color: var(--dashboard-blue);
      background: var(--dashboard-white);
      border: 2px solid var(--dashboard-blue);
      border-radius: 4px;
      font-weight: 800;
      transition:
        color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .outline:hover {
      color: var(--dashboard-white);
      background: var(--dashboard-blue);
      transform: translateY(-2px);
    }

    .dashboard-notice {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding: 17px 20px;
      color: var(--dashboard-white);
      background:
        linear-gradient(
          120deg,
          var(--dashboard-navy),
          var(--dashboard-blue)
        );
      border-left: 5px solid var(--dashboard-gold);
      border-radius: 5px;
      box-shadow: var(--dashboard-shadow);
    }

    .dashboard-notice span {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      flex-shrink: 0;
      color: var(--dashboard-navy);
      background: var(--dashboard-light-gold);
      border-radius: 50%;
      font-weight: 900;
    }

    .dashboard-notice p {
      margin: 0;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 26px;
      padding-bottom: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .filters button {
      min-height: 46px;
      padding: 11px 20px;
      flex-shrink: 0;
      color: var(--dashboard-blue);
      background: var(--dashboard-white);
      border: 1px solid rgba(18, 59, 122, 0.2);
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: 0 8px 22px rgba(7, 26, 61, 0.07);
    }

    .filters button:hover,
    .filters button.active {
      color: var(--dashboard-white);
      background:
        linear-gradient(
          135deg,
          var(--dashboard-navy),
          var(--dashboard-blue)
        );
      border-color: var(--dashboard-gold);
    }

    .booking-list {
      display: grid;
      gap: 18px;
    }

    .booking-list:empty::after {
      display: block;
      padding: 55px 25px;
      content: "No booking requests found.";
      color: var(--dashboard-muted);
      background: var(--dashboard-white);
      border: 1px dashed rgba(18, 59, 122, 0.28);
      border-radius: 7px;
      box-shadow: var(--dashboard-shadow);
      text-align: center;
    }

    /*
      These selectors style booking cards generated by owner.js.
      They support the existing booking-card class and direct
      children inserted into the booking list.
    */

    .booking-card,
    .booking-list > article,
    .booking-list > div {
      position: relative;
      display: grid;
      align-items: center;
      padding: 25px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid var(--dashboard-border);
      border-left: 6px solid var(--dashboard-gold);
      border-radius: 7px;
      box-shadow: var(--dashboard-shadow);
      grid-template-columns: 1fr 1fr minmax(190px, 0.55fr);
      gap: 25px;
    }

    .booking-card::before,
    .booking-list > article::before,
    .booking-list > div::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      content: "";
      background:
        linear-gradient(
          var(--dashboard-light-gold),
          var(--dashboard-gold)
        );
    }

    .booking-card h2,
    .booking-card h3,
    .booking-list > article h2,
    .booking-list > article h3,
    .booking-list > div h2,
    .booking-list > div h3 {
      margin: 5px 0;
      color: var(--dashboard-navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.45rem;
    }

    .booking-card p,
    .booking-list > article p,
    .booking-list > div p {
      margin: 5px 0;
      color: var(--dashboard-muted);
      overflow-wrap: anywhere;
    }

    .booking-card a,
    .booking-list > article a,
    .booking-list > div a {
      color: var(--dashboard-blue);
      font-weight: 700;
    }

    .booking-card strong,
    .booking-list > article strong,
    .booking-list > div strong {
      color: var(--dashboard-navy);
    }

    .booking-card select,
    .booking-list > article select,
    .booking-list > div select {
      width: 100%;
      min-height: 54px;
      padding: 12px 14px;
      color: var(--dashboard-navy);
      background: var(--dashboard-cream);
      border: 2px solid rgba(213, 166, 46, 0.55);
      border-radius: 4px;
      outline: none;
      font-weight: 800;
    }

    .booking-card select:focus,
    .booking-list > article select:focus,
    .booking-list > div select:focus {
      border-color: var(--dashboard-blue);
      box-shadow: 0 0 0 4px rgba(18, 59, 122, 0.12);
    }

    .status,
    .status-badge {
      display: inline-flex;
      width: fit-content;
      padding: 6px 10px;
      color: var(--dashboard-blue);
      background: #eaf1ff;
      border-radius: 100px;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .booking-card,
      .booking-list > article,
      .booking-list > div {
        grid-template-columns: 1fr 1fr;
      }

      .booking-card select,
      .booking-list > article select,
      .booking-list > div select {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 650px) {
      .owner-header {
        min-height: 72px;
        padding: 10px 16px;
      }

      .owner-header .brand {
        font-size: 1rem;
      }

      .owner-header .brand span {
        width: 44px;
        height: 44px;
        font-size: 0.78rem;
      }

      .website-link {
        padding: 9px 12px;
        font-size: 0.69rem;
      }

      .dashboard {
        width: 100%;
        padding: 35px 15px 75px;
      }

      .login-panel {
        margin: 15px auto;
        padding: 35px 22px;
      }

      .login-panel h1 {
        font-size: 3rem;
      }

      .dashboard-head {
        align-items: flex-start;
        margin-bottom: 25px;
      }

      .dashboard-head h1 {
        font-size: 3.2rem;
      }

      .outline {
        min-height: 43px;
        padding: 9px 13px;
        font-size: 0.75rem;
      }

      .dashboard-notice {
        align-items: flex-start;
      }

      .booking-card,
      .booking-list > article,
      .booking-list > div {
        padding: 22px 18px;
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .booking-card select,
      .booking-list > article select,
      .booking-list > div select {
        grid-column: auto;
      }

      .filters {
        margin-right: -15px;
        padding-right: 15px;
      }
    }
  </style>
</head>

<body class="owner-page">
  <header class="owner-header">
    <a class="brand" href="/">
      <span>BA</span>
      Braids by Athalia
    </a>

    <a class="website-link" href="/">
      ← View website
    </a>
  </header>

  <main class="dashboard">
    <!-- OWNER LOGIN -->
    <section id="login-panel" class="login-panel">
      <div class="login-icon" aria-hidden="true">🔐</div>

      <p class="eyebrow">Private owner area</p>

      <h1>Booking dashboard</h1>

      <p class="login-description">
        Enter your secure owner PIN to review and manage customer
        booking requests.
      </p>

      <form id="login-form">
        <label class="pin-label">
          Owner PIN

          <input
            name="pin"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            required
            placeholder="Enter owner PIN"
          >
        </label>

        <button class="button" type="submit">
          Open dashboard
        </button>

        <p
          id="login-message"
          class="message"
          role="status"
        ></p>
      </form>
    </section>

    <!-- BOOKINGS DASHBOARD -->
    <section id="booking-panel" hidden>
      <div class="dashboard-head">
        <div>
          <p class="eyebrow">Appointments</p>
          <h1>Booking requests</h1>
        </div>

        <button id="logout" class="outline" type="button">
          Log out
        </button>
      </div>

      <div class="dashboard-notice">
        <span aria-hidden="true">✓</span>

        <p>
          Review each request and change its status to
          <strong>Confirmed</strong>,
          <strong>Completed</strong>, or
          <strong>Cancelled</strong>.
        </p>
      </div>

      <div class="filters" aria-label="Booking filters">
        <button
          class="active"
          type="button"
          data-filter="All"
        >
          All
        </button>

        <button
          type="button"
          data-filter="Pending"
        >
          Pending
        </button>

        <button
          type="button"
          data-filter="Confirmed"
        >
          Confirmed
        </button>

        <button
          type="button"
          data-filter="Completed"
        >
          Completed
        </button>

        <button
          type="button"
          data-filter="Cancelled"
        >
          Cancelled
        </button>
      </div>

      <div
        id="bookings"
        class="booking-list"
        aria-live="polite"
      ></div>
    </section>
  </main>

  <script src="/owner.js"></script>
</body>
</html>
